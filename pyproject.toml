[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "painel-tvbox"
version = "0.1.0"
description = "Painel web para gerenciamento e monitoramento de TV Boxes Android"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",  # TestClient
]

[tool.setuptools]
# App roda como módulo a partir da raiz do projeto (uvicorn app.main:app);
# sem empacotamento — só precisamos que o pip instale as dependências.
py-modules = []
