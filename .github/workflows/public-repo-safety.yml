name: Public repo safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check tracked files for secrets
        run: python scripts/check_public_repo.py
