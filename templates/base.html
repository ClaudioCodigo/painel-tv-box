<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel TV Box</title>
    <link rel="stylesheet" href="/static/css/main.css?v=15">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=15">
    <link rel="stylesheet" href="/static/css/wizard.css?v=15">
    <link rel="stylesheet" href="/static/css/device.css?v=15">
    <link rel="stylesheet" href="/static/css/logs.css?v=15">
    <link rel="stylesheet" href="/static/css/backup.css?v=15">
    <link rel="stylesheet" href="/static/css/groups.css?v=15">
    <link rel="stylesheet" href="/static/css/scrcpy.css?v=15">
    <link rel="stylesheet" href="/static/css/devices.css?v=15">
    <link rel="stylesheet" href="/static/css/forms.css?v=15">
    <link rel="stylesheet" href="/static/css/apps.css?v=15">
    <link rel="stylesheet" href="/static/css/dropdown.css?v=15">
</head>
<body>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <span class="brand-icon">📡</span>
            <span class="brand-text">Painel TV Box</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#/" class="nav-item active" data-route="/">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="#/devices" class="nav-item" data-route="/devices">
                <span class="nav-icon">📺</span>
                <span class="nav-label">Dispositivos</span>
            </a>
            <a href="#/groups" class="nav-item" data-route="/groups">
                <span class="nav-icon">📁</span>
                <span class="nav-label">Grupos</span>
            </a>
            <a href="#/mediamtx" class="nav-item" data-route="/mediamtx">
                <span class="nav-icon">🔗</span>
                <span class="nav-label">MediaMTX</span>
            </a>
            <a href="#/logs" class="nav-item" data-route="/logs">
                <span class="nav-icon">📋</span>
                <span class="nav-label">Logs</span>
            </a>
            <a href="#/shell" class="nav-item" data-route="/shell">
                <span class="nav-icon">🖥️</span>
                <span class="nav-label">Shell</span>
            </a>
            <a href="#/scrcpy" class="nav-item" data-route="/scrcpy">
                <span class="nav-icon">📱</span>
                <span class="nav-label">scrcpy</span>
            </a>
            <a href="#/backup" class="nav-item" data-route="/backup">
                <span class="nav-icon">💾</span>
                <span class="nav-label">Backup</span>
            </a>
            <a href="#/settings" class="nav-item" data-route="/settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Configurações</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="#/wizard" class="btn btn-sm btn-secondary" style="width:100%;margin-bottom:6px">🧙 Wizard</a>
            <span class="version">v0.1.0</span>
        </div>
    </aside>

    <!-- HEADER -->
    <header id="header" class="header">
        <button id="sidebar-toggle" class="sidebar-toggle" title="Menu">
            <span class="toggle-icon">☰</span>
        </button>

        <h1 id="page-title" class="page-title">Dashboard</h1>

        <div class="header-right">
            <div class="status-dot" id="header-status" title="Status do sistema">
                <span class="dot online"></span>
                <span id="header-status-text">Carregando...</span>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="main-content">
        <!-- Renderizado dinamicamente pelo app.js -->
        <div id="view-container" class="view-container">
            <div class="loading">Carregando...</div>
        </div>
    </main>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="toast-container"></div>

    <!-- MODAL CONTAINER -->
    <div id="modal-container" class="modal-container hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content" id="modal-content"></div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/ws.js?v=15"></script>
    <script src="/static/js/api.js?v=15"></script>
    <script src="/static/js/components.js?v=15"></script>
    <script src="/static/js/dashboard.js?v=15"></script>
    <script src="/static/js/wizard.js?v=15"></script>
    <script src="/static/js/device.js?v=15"></script>
    <script src="/static/js/mediamtx.js?v=15"></script>
    <script src="/static/js/logs.js?v=15"></script>
    <script src="/static/js/backup.js?v=15"></script>
    <script src="/static/js/settings.js?v=15"></script>
    <script src="/static/js/groups.js?v=15"></script>
    <script src="/static/js/scrcpy.js?v=15"></script>
    <script src="/static/js/devices.js?v=15"></script>
    <script src="/static/js/shell.js?v=15"></script>
    <script src="/static/js/app.js?v=15"></script>
</body>
</html>
