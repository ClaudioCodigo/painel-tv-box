<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ device_name }} — Painel TV Box Signage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #signage-frame {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
      background-color: #000;
    }
    #fallback-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #111;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 9999;
    }
    #fallback-overlay h1 {
      font-size: 24px;
      margin-bottom: 12px;
      color: #ff5252;
    }
    #fallback-overlay p {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 20px;
      max-width: 600px;
      word-break: break-all;
    }
    #fallback-overlay button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    #status-badge {
      position: fixed;
      bottom: 8px;
      right: 8px;
      font-size: 11px;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #888;
      border-radius: 4px;
      pointer-events: none;
      z-index: 100;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }
    body:hover #status-badge {
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe id="signage-frame"
          src="{{ target_url }}"
          allow="fullscreen; autoplay; camera; microphone"
          sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads">
  </iframe>

  <div id="fallback-overlay">
    <h1>Falha ao carregar conteúdo</h1>
    <p id="fallback-url">{{ target_url }}</p>
    <button onclick="reloadFrame()">Tentar Novamente</button>
  </div>

  <div id="status-badge">Conectando ao painel...</div>

  <script>
    const DEVICE_ID = "{{ device_id }}";
    const TARGET_URL = "{{ target_url }}";
    let ws = null;
    let pingInterval = null;
    let reconnectTimeout = null;

    function requestFullScreen() {
      try {
        if (!document.fullscreenElement) {
          if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else if (document.documentElement.webkitRequestFullscreen) {
            document.documentElement.webkitRequestFullscreen();
          }
        }
      } catch (e) {}
    }

    document.addEventListener("click", requestFullScreen);
    document.addEventListener("touchstart", requestFullScreen);
    window.addEventListener("load", () => {
      setTimeout(requestFullScreen, 1000);
    });

    function updateBadge(text, color) {
      const badge = document.getElementById("status-badge");
      if (badge) {
        badge.textContent = text;
        if (color) badge.style.color = color;
      }
    }

    function reloadFrame() {
      const frame = document.getElementById("signage-frame");
      const overlay = document.getElementById("fallback-overlay");
      overlay.style.display = "none";
      frame.style.display = "block";
      frame.src = TARGET_URL;
    }

    function setupFrameMonitor() {
      const frame = document.getElementById("signage-frame");
      frame.addEventListener("error", () => {
        document.getElementById("fallback-overlay").style.display = "flex";
        frame.style.display = "none";
      });
    }

    function connectSignageWS() {
      if (reconnectTimeout) clearTimeout(reconnectTimeout);
      if (pingInterval) clearInterval(pingInterval);

      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${window.location.host}/ws/signage/${DEVICE_ID}`;

      try {
        ws = new WebSocket(wsUrl);
      } catch (e) {
        updateBadge("WS Erro", "#ff5252");
        reconnectTimeout = setTimeout(connectSignageWS, 5000);
        return;
      }

      ws.onopen = () => {
        updateBadge("Painel Conectado", "#4ade80");
        sendPing();
        pingInterval = setInterval(sendPing, 10000);
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.action === "reload") {
            reloadFrame();
          } else if (data.action === "navigate" && data.url) {
            const frame = document.getElementById("signage-frame");
            frame.src = data.url;
          }
        } catch (e) {}
      };

      ws.onclose = () => {
        updateBadge("Reconectando...", "#facc15");
        if (pingInterval) clearInterval(pingInterval);
        reconnectTimeout = setTimeout(connectSignageWS, 5000);
      };

      ws.onerror = () => {
        if (ws) ws.close();
      };
    }

    function sendPing() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "ping",
          device_id: DEVICE_ID,
          url: TARGET_URL,
          timestamp: Date.now()
        }));
      }
    }

    setupFrameMonitor();
    connectSignageWS();
  </script>
</body>
</html>
